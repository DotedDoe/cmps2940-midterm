<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Bakery Time</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="logo">Bakery Time</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="inventory.html">Inventory</a>
        <a href="cart.html">Cart <span id="cart-count" class="cart-count">0</span></a>
        <a href="login.html" class="active" aria-current="page">Login</a>
      </nav>
    </div>
  </header>

  <div id="modeToggle">
    <button id="themeToggle">Dark Mode</button>
  </div>

  <main>
    <section class="auth-form">
      <h2>Login / Register</h2>
      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">

        <button type="submit">Sign In</button>
      </form>
    </section>

    <section class="contact-form">
      <h2>Contact Us</h2>
      <form id="contact-form" novalidate>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Bakery Time</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
