  .card-grid {
      display: grid;
      /* as many columns as fit, each at least 220px, leftover space shared equally */
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
      padding: 0 24px;
    }

.image-counter-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      background: var(--card-bg);
      color: var(--card-text);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px var(--card-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

.image-counter-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px var(--card-shadow);
    }

.image-counter-card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: var(--img-bg);
    }

.item-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
    }

.item-name {
      margin: 0;
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      font-weight: 600;
    }

.item-price {
      margin: 0;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      opacity: 0.8;
    }

.counter-overlay {
      position: absolute;
      top: 20px;               /* 10px frame + 10px inset */
      right: 20px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 6px 10px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

.counter-overlay button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      line-height: 1;
      font-size: 14px;
    }

    .counter-overlay button:hover {
      background: rgba(255, 255, 255, 0.4);
    }

.add-to-cart {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #c8763a;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      cursor: pointer;
    }

.add-to-cart:hover {
      background: #a85f2b;
    }

    @media (min-width: 1400px) {
      .card-grid {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 28px;
      }

      .image-counter-card img {
        aspect-ratio: 3 / 2;
      }
    }

    @media (max-width: 600px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 0 12px;
      }

      .image-counter-card {
        padding: 6px;
      }

      .image-counter-card img {
        aspect-ratio: 1 / 1;
      }

      .counter-overlay {
        top: 12px;
        right: 12px;
      }

      .hero-banner .banner-logo {
        width: 120px;
      }
    }

<button id="mute-btn" type="button" aria-label="Mute music">🔊</button>

<script>
  const bg = document.getElementById('bg');
  bg.volume = 0.4; // optional: background music shouldn't be loud

  const events = ['pointerdown', 'click', 'keydown', 'touchend'];

  function start() {
    bg.play()
      .then(() => {
        // Only stop listening once playback actually started
        events.forEach(e => document.removeEventListener(e, start));
      })
      .catch(err => {
        // Blocked or failed: keep the listeners so the next tap/click retries
        console.warn('Audio could not start yet:', err);
      });
  }
  const muteBtn = document.getElementById('mute-btn');

muteBtn.addEventListener('click', (e) => {
  e.stopPropagation(); // don't let this click also trigger start()
  bg.muted = !bg.muted;
  muteBtn.textContent = bg.muted ? '🔇' : '🔊';
  muteBtn.setAttribute('aria-label', bg.muted ? 'Unmute music' : 'Mute music');
});

  events.forEach(e => document.addEventListener(e, start));
</script>

  <script>
    const counts = {};

    function inc(id) {
      counts[id] = (counts[id] || 0) + 1;
      document.getElementById(id).textContent = counts[id];
    }

    function dec(id) {
      counts[id] = Math.max((counts[id] || 0) - 1, 0);
      document.getElementById(id).textContent = counts[id];
    }

    // Adds a featured item to the same cart the cart and checkout pages use
    // (getCartItems / saveCartItems / updateCartCountBadge come from cart.js and app.js)
    function addFeaturedToCart(btn, countId) {
      const qty = counts[countId] || 0;
      if (qty === 0) return; // nothing selected

      const card = btn.closest('.image-counter-card');
      const { id, name, price } = card.dataset;
      const unitPrice = parseFloat(price);

      const items = getCartItems();
      const existing = items.find(item => item.cartLineId === id);

      if (existing) {
        existing.qty += qty;
      } else {
        items.push({
          cartLineId: id,
          productId: id,
          name,
          basePrice: unitPrice,
          selectedOptions: [],
          unitPrice,
          qty,
          image: card.querySelector('img').src
        });
      }

      saveCartItems(items);
      updateCartCountBadge();

      // reset the counter
      counts[countId] = 0;
      document.getElementById(countId).textContent = 0;
    }
  </script>
