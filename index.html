<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Cookie Time Cookie</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* --- Image + counter overlay styles --- */
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }

    .image-counter-card {
      position: relative;      /* positioning reference for the overlay */
      display: inline-block;
      width: 300px;
    }

    .image-counter-card img {
      display: block;
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .counter-overlay {
      position: absolute;      /* sits on top of the image */
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 6px 10px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .counter-overlay button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      line-height: 1;
      font-size: 14px;
    }

    .counter-overlay button:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="logo">Cookie Time Cookie</a>
      <nav class="main-nav">
        <a href="index.html" class="active" aria-current="page">Home</a>
        <a href="inventory.html">Inventory</a>
        <a href="cart.html">Cart <span id="cart-count" class="cart-count">0</span></a>
        <a href="login.html">Login</a>
        <a href="create.html">Create Your Own</a>
      </nav>
    </div>
  </header>

  <div id="modeToggle">
    <button id="themeToggle">Dark Mode</button>
  </div>

  <main>
    <section class="hero">
      <h1>Welcome to Cookie Time Cookie</h1>
      <p>We are an independent bakery that sells you baked goods!</p>
    </section>

    <section class="announcements">
    </section>

<audio id="background-music" loop>
  <source src="fluffing.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

    <section class="highlights">
      <h2>Featured Items</h2>

      <div class="card-grid">

        <div class="image-counter-card">
          <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fbakewithshivesh.com%2Fwp-content%2Fuploads%2F2020%2F05%2F151F814A-2749-4978-BA53-3AD2A962C933-scaled.jpg&f=1&nofb=1&ipt=fd4bddd16a29d46bfd11e9d93fb13b002a94f1f3ac3905ec48e6e902d98a0e93" alt="WE NEED TO COOK!">
          <div class="counter-overlay">
            <button onclick="dec('count1')">−</button>
            <span id="count1">0</span>
            <button onclick="inc('count1')">+</button>
          </div>
        </div>

        <div class="image-counter-card">
          <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fbellyfull.net%2Fwp-content%2Fuploads%2F2025%2F02%2FSugar-Cookies-hero-1.jpg&f=1&nofb=1&ipt=d2836a14c2e40496aa96858c00c7fbcf72ac28a968b205a3f971c42e61227203" alt="R.I.P Dolly Parton">
          <div class="counter-overlay">
            <button onclick="dec('count2')">−</button>
            <span id="count2">0</span>
            <button onclick="inc('count2')">+</button>
          </div>
        </div>

        <div class="image-counter-card">
          <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwww.modernhoney.com%2Fwp-content%2Fuploads%2F2017%2F11%2FThin-and-Crispy-Chocolate-Chip-Cookies-2.jpg&f=1&nofb=1&ipt=3d43b3cebdf51e9068b93d1f30298138f3ecb81bf1dba897e068d53faf4a56e1" alt="MR WHITE! IM TIRED YO!">
          <div class="counter-overlay">
            <button onclick="dec('count3')">−</button>
            <span id="count3">0</span>
            <button onclick="inc('count3')">+</button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Bakery Time</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    // Tracks a separate count per image, keyed by the span's id
    const counts = {};

    function inc(id) {
      counts[id] = (counts[id] || 0) + 1;
      document.getElementById(id).textContent = counts[id];
    }

    function dec(id) {
      counts[id] = (counts[id] || 0) - 1;
      document.getElementById(id).textContent = counts[id];
    }
  </script>
</body>
</html>
