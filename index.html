    <meta charset="UTF-8" />

    <title>Counter</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body id="body">
    <main>
        <div class="container">
      <div class="counter">
        <p id="count">0</p>
      </div>
      <div>
        <button onclick="dec()">Decrease</button>
        <button onclick="inc()">Increase</button>
      </div>
    </div>
    </main>
    <script>
    let count = 0;
    let incClicks = 0;
    let decClicks = 0;

    const countEl = document.getElementById("count");
    const incEl = document.getElementById("incCount");
    const decEl = document.getElementById("decCount");

    function inc() {
      count++;
      incClicks++;
      countEl.textContent = count;
      incEl.textContent = incClicks;
    }

    function dec() {
      count--;
      decClicks++;
      countEl.textContent = count;
      decEl.textContent = decClicks;
    }
  </script>
</body>
