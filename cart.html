<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Sweet Crumb Bakery</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Same nav markup as inventory.html — keep this block identical
       across every page, just move class="active"/aria-current here. -->
  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="logo">Sweet Crumb</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="inventory.html">Inventory</a>
        <a href="cart.html" class="active" aria-current="page">Cart <span id="cart-count" class="cart-count">0</span></a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="cart-page">

    <h1>Your Cart</h1>

    <!-- ============================================================
         CART LINES
         Empty in the HTML on purpose, same reasoning as inventory.html's
         #product-grid: cart.js is the single source of truth for what
         a cart line looks like (renderCartLine() in cart.js), reading
         straight from localStorage via getCartItems(). This container
         gets fully rebuilt every time an item's quantity changes or
         something is removed, so it always reflects what's actually
         stored — never a stale copy.
         ============================================================ -->
    <section id="cart-items" class="cart-items">
      <!-- cart line items injected here by js/cart.js's renderCart() -->
    </section>

    <!-- Shown/hidden by renderCart() depending on whether the cart
         array from localStorage is empty. -->
    <p id="empty-cart-message" class="empty-cart-message" hidden>
      Your cart is empty. Head over to the
      <a href="inventory.html">inventory</a> to find something sweet.
    </p>

    <!-- ============================================================
         ORDER SUMMARY
         #cart-total is the only dynamic piece here — cart.js recalculates
         it (unitPrice × qty, summed across every line) on every render.
         The checkout button is intentionally non-functional for the
         midterm: there's no backend to submit an order to yet. It's
         left here as a visual placeholder for the final project, where
         it'll POST to a real Symfony endpoint instead.
         ============================================================ -->
    <section class="cart-summary">
      <div class="summary-row">
        <span>Total</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button class="checkout-btn" disabled title="Checkout will be wired up in the final project">
        Checkout
      </button>
    </section>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Sweet Crumb Bakery</p>
  </footer>

  <!-- app.js first (getCatalogItems, formatPrice, updateCartCountBadge),
       then cart.js, which reads #cart-items and renders this whole
       page — no separate "cart-page.js" needed, since rendering the
       cart page IS what cart.js is for per the project's file-naming
       spec. catalog.js isn't loaded here; this page has nothing to do
       with search/filter. -->
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
