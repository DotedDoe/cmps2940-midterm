<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Bakery <Time></Time></title>
  <title>Cart — Cookie Time Cookie</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="logo">Bakery Time</a>
      <a href="index.html" class="logo">Cookie Time Cookie</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="inventory.html">Inventory</a>
        <a href="cart.html" class="active" aria-current="page">Cart <span id="cart-count" class="cart-count">0</span></a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>


  <div id="modeToggle">
    <button id="themeToggle">Dark Mode</button>
  </div>

  <main>
    <section class="cart-items" id="cart-items">
      <!-- Cart line items rendered by cart.js -->
  <main class="cart-page">

    <h1>Your Cart</h1>

    <section id="cart-items" class="cart-items">
    
    </section>

    <p id="empty-cart-message" class="empty-cart-message" hidden>
      Your cart is empty. Head over to the
      <a href="inventory.html">inventory</a> to find something sweet.
    </p>

    <section class="cart-summary">
      <div class="summary-row">
        <span>Total</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button class="checkout-btn" disabled title="Checkout will be wired up in the final project">
        Checkout
      </button>
    </section>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Cookie Time Cookie</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
