<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customize Your Order</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">Your Bakery</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="inventory.html">Catalog</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>Build Your Order</h1>
    <p>Pick an item from the carousel below, then customize it just the way you like it.</p>
  </section>

  <section class="product-carousel-wrapper" aria-label="Choose an item to customize">
    <button type="button" class="carousel-btn prev-btn" id="product-carousel-prev" aria-label="Previous item">&#10094;</button>
    <div class="product-carousel-track" id="product-carousel-track"></div>
    <button type="button" class="carousel-btn next-btn" id="product-carousel-next" aria-label="Next item">&#10095;</button>
  </section>

  <section id="customizer-panel" aria-live="polite">
    <!-- Populated by js/create.js based on the selected product -->
  </section>

  <footer>
    <p>&copy; 2026 Your Bakery. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
